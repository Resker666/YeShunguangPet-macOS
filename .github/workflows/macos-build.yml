name: macOS App

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      prepare_release:
        description: Prepare an unpublished Release draft after all checks (main only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: macos-app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      commit: ${{ steps.metadata.outputs.commit }}
      arm64_artifact: ${{ steps.arm64.outputs.artifact-id }}
      intel_artifact: ${{ steps.intel.outputs.artifact-id }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Record build environment
        id: metadata
        env:
          PREPARE_RELEASE: ${{ inputs.prepare_release || false }}
        run: |
          set -euo pipefail
          mkdir -p .build/ci-logs
          test "$(uname -m)" = arm64
          {
            sw_vers
            uname -m
            xcodebuild -version
            xcrun swift --version
            python3 --version
            git rev-parse HEAD
          } | tee .build/ci-logs/environment.log
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Sources/YeShunguangPet/Info.plist)
          if [ "$PREPARE_RELEASE" = true ]; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$GITHUB_REF" = refs/heads/main
            test -s "docs/release-notes/$version.md"
          fi
          revision=$(git rev-parse --short=12 HEAD)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run release preparation tests
        run: python3 -m unittest discover -s Tests/Release -v 2>&1 | tee .build/ci-logs/release-tests.log

      - name: Run native tests
        run: bash scripts/test.sh -resultBundlePath .build/ci-logs/native-tests.xcresult 2>&1 | tee .build/ci-logs/native-tests.log

      - name: Build Apple Silicon app
        run: bash scripts/build-app.sh arm64 2>&1 | tee .build/ci-logs/build-arm64.log

      - name: Cross-build Intel app
        run: bash scripts/build-app.sh x86_64 2>&1 | tee .build/ci-logs/build-x86_64.log

      - name: Run distribution and standalone app tests
        run: python3 -m unittest discover -s Tests/Distribution -v 2>&1 | tee .build/ci-logs/distribution-tests.log

      - name: Package Apple Silicon app
        run: bash scripts/package-app.sh arm64 2>&1 | tee .build/ci-logs/package-arm64.log

      - name: Package Intel app
        run: bash scripts/package-app.sh x86_64 2>&1 | tee .build/ci-logs/package-x86_64.log

      - name: Verify packaged files and source provenance
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import plistlib
          import subprocess

          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if subprocess.check_output(['git', 'status', '--porcelain', '--untracked-files=no'], text=True).strip():
              raise SystemExit('Tracked source changed during the build')
          for architecture, app in [('arm64', Path('dist/YeShunguangPet.app')),
                                    ('x86_64', Path('dist/x86_64/YeShunguangPet.app'))]:
              info = json.loads((app / 'Contents/Resources/build-info.json').read_text())
              if info != {'commit': commit, 'trackedChanges': False, 'architecture': architecture}:
                  raise SystemExit('Unexpected build provenance: ' + architecture)
              version = plistlib.loads((app / 'Contents/Info.plist').read_bytes())['CFBundleShortVersionString']
              for extension in ['dmg', 'zip']:
                  filename = 'YeShunguangPet-' + version + '-macOS-' + architecture + '.' + extension
                  artifact = Path('dist') / filename
                  if not artifact.is_file() or artifact.stat().st_size == 0:
                      raise SystemExit('Missing package: ' + filename)
                  subprocess.run(['shasum', '-a', '256', '-c', filename + '.sha256'], cwd='dist', check=True)
          PY

      - name: Upload Apple Silicon packages
        id: arm64
        uses: actions/upload-artifact@v7
        with:
          name: YeShunguangPet-${{ steps.metadata.outputs.version }}-arm64-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            dist/YeShunguangPet-*-macOS-arm64.dmg
            dist/YeShunguangPet-*-macOS-arm64.dmg.sha256
            dist/YeShunguangPet-*-macOS-arm64.zip
            dist/YeShunguangPet-*-macOS-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload Intel packages
        id: intel
        uses: actions/upload-artifact@v7
        with:
          name: YeShunguangPet-${{ steps.metadata.outputs.version }}-x86_64-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            dist/YeShunguangPet-*-macOS-x86_64.dmg
            dist/YeShunguangPet-*-macOS-x86_64.dmg.sha256
            dist/YeShunguangPet-*-macOS-x86_64.zip
            dist/YeShunguangPet-*-macOS-x86_64.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Show package download links
        env:
          ARM64_URL: ${{ steps.arm64.outputs.artifact-url }}
          INTEL_URL: ${{ steps.intel.outputs.artifact-url }}
          REVISION: ${{ steps.metadata.outputs.revision }}
        run: |
          {
            printf '构建提交：`%s`\n\n' "$REVISION"
            printf '[下载 Apple Silicon 安装包](%s)\n\n' "$ARM64_URL"
            printf '[下载 Intel 实验安装包](%s)\n\n' "$INTEL_URL"
            printf '每份产物包含 DMG、ZIP 和对应 SHA-256，保留14天。\n\n'
            printf '产物为 ad-hoc 签名、未公证。Intel 仅交叉构建，未验证实机运行。\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build and test diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: macOS-diagnostics-${{ github.run_number }}-${{ github.run_attempt }}
          path: .build/ci-logs/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  release-draft:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.prepare_release && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release-draft-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Check out the verified source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false

      - name: Download this run's two verified package artifacts
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.arm64_artifact }},${{ needs.build.outputs.intel_artifact }}
          merge-multiple: true
          path: .build/release-assets

      - name: Prepare unpublished draft and verify uploaded assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          SOURCE_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          set -euo pipefail
          python3 scripts/prepare-release.py --assets .build/release-assets --version "$VERSION" \
            --commit "$SOURCE_COMMIT" --notes "docs/release-notes/$VERSION.md" > .build/release-draft.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads(Path('.build/release-draft.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('[查看未发布的 Release 草稿](' + result['url'] + ')\n\n')
              stream.write('八份附件的名称、大小及 SHA-256 已核对。请核对说明与安装体验后手动发布。\n')
          PY
